[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pos-cli"
version = "1.0.0"
description = "CLI tool for VeraPOS - Point of Sale System"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.0",
]

[project.scripts]
pos = "pos_cli.cli:cli"

[tool.setuptools.packages.find]
include = ["pos_cli*"]
